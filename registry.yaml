skills:
  - id: edgy-assessment
    path: skills/architecture/edgy-assessment
    version: 1.8.0
    category: architecture
    tags: [edgy, enterprise-design, architecture, analysis, assessment, diagram, fi, en, fr, de]
    agents: [claude-code, cursor, vibe, generic]
    description: >
      Comprehensive EDGY 23 Enterprise Design assessment: analysis, diagrams, and recommendations. Orchestrating skill that chains edgy-framework and edgy-diagram skills into a unified workflow. Locks PDF report layout via shared preamble (assets/pdf-preamble.md) while keeping analysis content adaptive per customer.

  - id: edgy-deep-dive
    path: skills/architecture/edgy-deep-dive
    version: 1.1.0
    category: architecture
    tags: [edgy, enterprise-design, architecture, analysis, deep-dive, intersection, fi, en]
    agents: [claude-code, cursor, generic]
    description: >
      Targeted EDGY 23 deep-dive analysis of a specific element pair or facet combination. Requires an existing edgy-model.json produced by the edgy-assessment skill. Analyses the chosen elements through one of four analytical lenses (dependency, alignment, gaps, opportunities) using both direct core links and 2-hop paths. Produces a focused markdown report and a pairwise draw.io diagram.

  - id: edgy-framework
    path: skills/architecture/edgy-framework
    version: 1.5.0
    category: architecture
    tags: [edgy, enterprise-design, architecture, analysis, reframing, fi, en, fr, de]
    agents: [claude-code, cursor, generic]
    description: >
      EDGY 23 enterprise design analysis: challenge reframing, facet intersection analysis, element identification from natural language, and modelling guidance for strategy documents (strategy → Purpose/Outcome mapping), capability formulation and the organisation role model.

  - id: edgy-target-state
    path: skills/architecture/edgy-target-state
    version: 1.0.1
    category: architecture
    tags: [edgy, enterprise-design, architecture, target-state, capability-map, roadmap, fi, en]
    agents: [claude-code, cursor, generic]
    description: >
      Internal target-state architecture workflow on EDGY 23: strategy → purpose map, capability map and cards, guardrails, building-block hypothesis with transition overlay, work packages, decision records (via an external ADR skill), role model and a stakeholder summary. Orchestrates edgy-framework (target-state mode) and edgy-diagram (generator, lint, preview). Complements edgy-assessment, which is the outside-in assessment of a company from public sources.

  - id: edgy-diagram
    path: skills/documentation/edgy-diagram
    version: 2.5.0
    category: documentation
    tags: [diagram, drawio, visualization, documentation, edgy, enterprise-design, fi, en, fr, de]
    agents: [claude-code, cursor, generic]
    description: >
      Create EDGY-notation diagrams as draw.io XML (multi-page mxfile) or PlantUML source and export them to PNG/SVG/PDF. Generator-first workflow (edgy_generator.py) with core-link pair validation, an influence-verb vocabulary, a drawio linter (edgy_lint.py) and a CLI-free SVG/PNG preview (edgy_render.py) that the agent must look at before delivery. Uses the EDGY facet model with draw.io CLI or the plantuml-stdlib `<edgy/edgy>` library for rendering.

