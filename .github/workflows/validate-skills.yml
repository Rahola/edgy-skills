name: Validate Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'registry.yaml'
      - 'tools/**'
      - 'docs/examples/**'
      - '.github/workflows/validate-skills.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'registry.yaml'
      - 'tools/**'
      - 'docs/examples/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    name: Validate SKILL.md files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the tags: check.sh compares the examples with the pinned v2.4.0 tag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run check.sh (validator + registry-sync + examples-refs)
        # Huom: privacy-scan on osa check.sh:ta mutta ohittuu CI:ssä (ei
        # .blocklist-tiedostoa eikä secrettiä — tietoinen valinta, ei tallenneta
        # asiakaslistaa pilveen). Asiakasnimien esto tehdään PAIKALLISESTI
        # pre-commit-hookilla (tools/install-git-hooks.sh + .blocklist).
        run: bash tools/check.sh --verbose

      - name: Walkthrough browser tests
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/edgy-browser" playwright@1.62.1 @axe-core/playwright@4.14.0
          export NODE_PATH="$RUNNER_TEMP/edgy-browser/node_modules"
          export EDGY_CHROMIUM="$(command -v google-chrome)"
          node tools/test-walkthrough.cjs

      - name: Examples heuristic (nameless privacy reminder)
        if: always()
        run: bash tools/examples-heuristic.sh
